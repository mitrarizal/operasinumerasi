plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services' // <-- Tanpa 'version 4.5.0' karena sudah diatur di settings.gradle.kts
}

android {
    namespace 'com.bilangannumerasiapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.bilangannumerasiapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Firebase BoM (Bill of Materials) untuk mengelola versi Firebase secara otomatis
    implementation platform('com.google.firebase:firebase-bom:33.9.0')

    // Tambahkan dependensi Firebase yang Anda gunakan (contoh: Firebase Realtime Database)
    implementation 'com.google.firebase:firebase-database'
}
